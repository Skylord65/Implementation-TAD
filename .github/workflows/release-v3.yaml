
name: Release V3

on:
  push:
    paths:
      - 'v3/**'
      - '.github/workflows/release-v3.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'v3/**'
      - '.github/workflows/release-v3.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test V3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make valgrind

      - name: Compilation TP1 Exercice 1
        run: |
          cd v3/TP1/Exercice1
          make clean
          make

      - name: Execution TP1 Exercice 1
        run: |
          cd v3/TP1/Exercice1
          ./stack_ex1 ../Test/testfile1.txt
          ./stack_ex1 ../Test/testfile2.txt

      - name: Execution TP1 Exercice 1 avec Valgrind
          cd v3/TP1/Exercice2
          valgrind ./stack_ex1 ../Test/testfile1.txt
          valgrind ./stack_ex1 ../Test/testfile2.txt

      - name: Compilation TP1 Exercice 2
        run: |
          cd v3/TP1/Exercice2
          make clean
          make

      - name: Execution TP1 Exercice 2
        run: |
          cd v3/TP1/Exercice2
          ./stack_ex2 ../Test/testfile1.txt
          ./stack_ex2 ../Test/testfile2.txt

      - name: Execution TP1 Exercice 2 avec Valgrind
          cd v3/TP1/Exercice2
          valgrind ./stack_ex2 ../Test/testfile1.txt
          valgrind ./stack_ex2 ../Test/testfile2.txt

      - name: Compilation TP2
        run: |
          cd v3/TP2/Code
          make clean
          make

      - name: Execution TP2
        run: |
          cd v3/TP2/Code
          ./evaluate ../Test/exercice1.txt

      - name: Execution TP2 avec Valgrind
        run: |
          cd v3/TP2/Code
          valgrind ./evaluate ../Test/exercice1.txt

      - name: Compilation TP3
        run: |
          cd v3/TP3/Code
          make mrproper
          make

      - name: Execution TP3
        run: |
          cd v3/TP3/Code
          ./list_test 1
          ./list_test 2
          ./list_test 3
          ./list_test 4
          ./list_test 5

      - name: Execution TP3 avec Valgrind
        run: |
          cd v3/TP3/Code
          valgrind ./list_test 1
          valgrind ./list_test 2
          valgrind ./list_test 3
          valgrind ./list_test 4
          valgrind ./list_test 5