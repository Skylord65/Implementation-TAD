
name: Release V3

on:
  push:
    paths:
      - 'v3/**'
      - '.github/workflows/release-v3.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'v3/**'
      - '.github/workflows/ci-v3.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test V3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make

      - name: Identify TPs
        id: identify
        run: |
          TP_FILE="/tmp/tps.list"
          touch "$TP_FILE"
          echo "tp_file=$TP_FILE" >> "$GITHUB_OUTPUT"

          ELIGIBLE=$( find v3 -name "TP*" -type d ) # Localisation de tous les dossiers du genre TP...
          for dir in $ELIGIBLE; do
            # Un dossier est valide, si il contient au moins un makefile quelque part, si il y en a plusieurs c'est pas grave, on vérifie juste que :
            # - Un makefile

            makes="$( find $dir -iname makefile -type f )"
            if [[ -n "$makes" ]]; then
              # Entrée non-vide = au moins un match
              echo "$( realpath $dir )" >> "$TP_FILE"
              echo "$( basename $dir ) ajouté à la liste"
            fi
          done

          echo "-------------------"
          cat "$TP_FILE"

      - name: Test builds
        id: build
        env:
          TP_FILE: ${{ steps.identify.outputs.tp_file }}
        run: |
          ROOT="$( pwd )"
          while IFS= read -r tp; do
            cd "$tp"
            if [[ -d "$tp/Lib" ]]; then
              mkfile="$( find $tp/Lib -iname makefile -type f )"
              if [[ -n "$mkfile" ]]; then
                mkfiledir="$( dirname -- $mkfile )"
                echo "Library found. Compiling first"
                make -C "$mkfiledir"
              fi
            fi
            makes=$( find . -iname makefile -type f )

            for makefile in $makes; do
              MAKEFILE_DIR="$( dirname -- $makefile )"
              echo "Compiling with makefile $makefile"
              echo "  MAKEFILE_DIR: $MAKEFILE_DIR"
              make -C "$MAKEFILE_DIR" || true

              # Écriture de l'éxécutable dans un fichier nommé ${makefile}.exec
              exec_name="${MAKEFILE_DIR}/$( cat "$makefile" | grep -E "^EXEC *= *" | awk -F'=' '{print $2}' | tr -d ' ' )"
              if [[ -z "$exec_name" ]]; then
                echo "Executable not found for $makefile"
              else
                echo "$( realpath $exec_name )" > "${makefile}.exec"
              fi
            done
          done < "$TP_FILE"

          cd "$ROOT"

      - name: Testing des TPs
        env:
          TP_FILE: ${{ steps.identify.outputs.tp_file }}
        run: |
          ROOT="$( pwd )"
          while IFS= read -r tp; do
            cd "$tp"
            if [[ ! -d Test ]]; then
              echo "No Test dir found for $( basename $tp )"
              continue
            fi

            tests=$( find Test -name "*.txt" -type f )
            for test in $tests; do
              executables=$( find . -iname "makefile.exec" -type f )
              for exe in $executables; do
                echo "Running $exe $test"
                $( cat $exe ) $test
              done
            done
          done < "$TP_FILE"

          cd "$ROOT"

